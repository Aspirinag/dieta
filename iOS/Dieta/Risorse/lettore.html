<!DOCTYPE html>
<html lang="it">
<head><meta charset="UTF-8"></head>
<body>
<!-- Lettore invisibile dei PDF per l'app: le funzioni di lettura sono in parser-pdf.js, condiviso con la web app.
     Il worker di pdf.js è caricato nella pagina, così gira senza Web Worker. -->
<script src="pdf.min.js"></script>
<script src="pdf.worker.min.js"></script>
<script src="parser-pdf.js"></script>
<script>
  const daBase64 = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  const comeFile = (b64) => ({ arrayBuffer: async () => daBase64(b64).buffer });

  // Chiamate dall'app (Swift): ricevono il PDF in base64 (e la password, se c'è) e restituiscono JSON
  async function schema(b64, pwd) { return JSON.stringify(await leggiSchemaPdf(comeFile(b64), pwd || '')); }
  async function bia(b64, pwd) { return JSON.stringify(await leggiBiaPdf(comeFile(b64), pwd || '')); }
</script>
</body>
</html>
