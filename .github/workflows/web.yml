name: Web app

on:
  push:
    branches: [main]
    paths: &percorsi
      - index.html
      - iOS/Forma/Risorse/lettore.html
      - scripts/controlla-lettore.mjs
      - scripts/prova-dati-web.mjs
      - .github/workflows/web.yml
  pull_request:
    paths: *percorsi

jobs:
  controlli:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lettore dei PDF uguale a Forma
        run: node scripts/controlla-lettore.mjs
