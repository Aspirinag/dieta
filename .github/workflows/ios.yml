# Compila l'app iOS nativa (SwiftUI).
# Su main la pubblica per SideStore (.ipa non firmata: la firma la fa SideStore con il tuo Apple ID);
# sugli altri branch fa le schermate nel simulatore e le mette nel branch "schermate"
name: App iOS

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Legge la versione dal progetto
        run: echo "VERSIONE=$(bash scripts/versione.sh)" >> "$GITHUB_ENV"
      - name: Compila l'app
        run: >
          xcodebuild -project iOS/Dieta.xcodeproj -target Dieta -configuration Release -sdk iphoneos
          SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO
          CURRENT_PROJECT_VERSION=${{ github.run_number }}
          build
      - name: Crea la .ipa
        run: |
          mkdir Payload
          cp -R build/Release-iphoneos/Dieta.app Payload/
          zip -qry Dieta.ipa Payload
      - name: Pubblica per SideStore
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v$VERSIONE
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG esiste già: si pubblica solo con un numero nuovo"
            exit 0
          fi
          node scripts/sidestore-source.mjs $VERSIONE Dieta.ipa "https://github.com/${{ github.repository }}/releases/download/$TAG/Dieta.ipa"
          bash scripts/versione.sh --note > note.md
          gh release create $TAG Dieta.ipa sidestore.json --title "Dieta $VERSIONE" --notes-file note.md --latest

  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Esegue i test
        run: >
          xcodebuild test -project iOS/Dieta.xcodeproj -scheme Dieta
          -destination 'platform=iOS Simulator,name=iPhone 17'
          CODE_SIGNING_ALLOWED=NO

  schermate:
    if: github.ref != 'refs/heads/main'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Compila per il simulatore
        run: >
          xcodebuild -project iOS/Dieta.xcodeproj -target Dieta -configuration Debug -sdk iphonesimulator
          ARCHS=arm64 SYMROOT="$PWD/build" build
      - name: Schermate
        run: bash scripts/schermate.sh build/Debug-iphonesimulator/Dieta.app io.github.aspirinag.dieta "oggi dieta dieta:spesa allenamento progressi profilo"
      - name: Pubblica le schermate nel branch "schermate"
        run: |
          cd schermate
          git init -q -b schermate
          git add .
          git -c user.name="GitHub Actions" -c user.email="actions@github.com" commit -qm "Schermate di ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" schermate
