# Compila Forma (dieta + palestra in un'unica app SwiftUI).
# Esegue sempre i test; su main pubblica la .ipa in una release; sugli altri branch fa le schermate
# nel simulatore e le mette nel branch "schermate-forma"
name: Forma iOS

on:
  push:
    paths:
      - 'iOS/Forma/**'
      - 'iOS/Forma.xcodeproj/**'
      - 'iOS/FormaTests/**'
      - 'iOS/FormaUITests/**'
      - '.github/workflows/forma.yml'
      - 'scripts/schermate.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    env:
      VERSIONE: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Compila l'app
        run: >
          xcodebuild -project iOS/Forma.xcodeproj -target Forma -configuration Release -sdk iphoneos
          SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO
          MARKETING_VERSION=$VERSIONE CURRENT_PROJECT_VERSION=${{ github.run_number }}
          build
      - name: Crea la .ipa
        run: |
          mkdir Payload
          cp -R build/Release-iphoneos/Forma.app Payload/
          # Firma ad hoc con gli entitlement (HealthKit): chi la rifirma per installarla li ritrova
          codesign --force --sign - --entitlements iOS/Forma.entitlements Payload/Forma.app
          codesign -d --entitlements - Payload/Forma.app
          zip -qry Forma.ipa Payload
      - name: Conserva la .ipa
        uses: actions/upload-artifact@v4
        with:
          name: forma-ipa
          path: Forma.ipa

  pubblica:
    # Su main la release esce solo se i test sono passati
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERSIONE: 1.0.${{ github.run_number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: forma-ipa
      - name: Pubblica la release
        run: |
          gh release create forma-v$VERSIONE Forma.ipa --repo ${{ github.repository }} \
            --title "Forma $VERSIONE" --notes "Forma, dieta e palestra" --latest

  test:
    # Test di unità e dell'interfaccia nel simulatore, dopo la build (un Mac alla volta)
    needs: build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Esegui i test
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')))")
          echo "Simulatore: $SIM"
          xcodebuild test -project iOS/Forma.xcodeproj -scheme Forma -destination "id=$SIM" \
            -resultBundlePath risultati.xcresult -quiet
      - name: Conserva i risultati
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: risultati-test
          path: risultati.xcresult

  schermate:
    # Dopo i test: con un solo Mac libero alla volta, due job insieme restavano in coda e venivano annullati
    needs: test
    if: github.ref != 'refs/heads/main'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Compila per il simulatore
        run: >
          xcodebuild -project iOS/Forma.xcodeproj -target Forma -configuration Debug -sdk iphonesimulator
          ARCHS=arm64 SYMROOT="$PWD/build" build
      - name: Schermate
        run: bash scripts/schermate.sh build/Debug-iphonesimulator/Forma.app io.github.aspirinag.forma "oggi dieta dieta:spesa allenamento inCorso profilo"
      - name: Pubblica le schermate nel branch "schermate-forma"
        run: |
          cd schermate
          git init -q -b schermate-forma
          git add .
          git -c user.name="GitHub Actions" -c user.email="actions@github.com" commit -qm "Schermate di ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" schermate-forma
