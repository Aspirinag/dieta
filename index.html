<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dieta">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f4fff8">
<title>Dieta</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; color: #fff; font-family: -apple-system, system-ui, sans-serif; }
  html { background: #2c2c36; }
  body {
    min-height: 100vh;
    background: radial-gradient(circle at 85% 0%, rgba(212, 255, 63, 0.18), transparent 42%), linear-gradient(180deg, #3d3d4a 0%, #2a2a34 100%);
    background-attachment: fixed;
    padding-bottom: calc(110px + env(safe-area-inset-bottom));
    padding-top: env(safe-area-inset-top);
  }
  main { padding: 20px; }
  h1 { font-size: 28px; margin: 8px 0 12px; }
  h2 { font-size: 20px; margin: 24px 0 8px; }
  .muted { color: #d4d4dc; font-size: 14px; margin: 4px 0; }
  .card { background: rgba(255, 255, 255, 0.14); -webkit-backdrop-filter: blur(24px) saturate(160%); backdrop-filter: blur(24px) saturate(160%); border: 1px solid rgba(255, 255, 255, 0.22); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15), 0 8px 32px rgba(0, 0, 0, 0.3); border-radius: 20px; padding: 16px; margin-bottom: 12px; }
  .between { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
  input { background: rgba(255, 255, 255, 0.18); color: #fff; border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 12px; padding: 10px 12px; font-size: 16px; min-width: 0; width: 100%; }
  input::placeholder { color: #b0b0bb; }
  button { font: inherit; border: none; cursor: pointer; }
  .primary { display: block; width: 100%; background: linear-gradient(rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0) 55%), #d4ff3f; color: #0a0a0a; font-weight: 700; font-size: 16px; border-radius: 16px; padding: 14px; margin: 12px 0; }
  .small.mini { padding: 4px 8px; font-size: 13px; border-radius: 8px; }
  .small { background: rgba(255, 255, 255, 0.18); border: 1px solid rgba(255, 255, 255, 0.25); color: #fff; font-weight: 600; border-radius: 12px; padding: 10px 14px; }
  .chip { background: rgba(255, 255, 255, 0.18); border: 1px solid rgba(255, 255, 255, 0.25); color: #fff; font-weight: 600; border-radius: 999px; padding: 8px 14px; }
  .chip.on { background: #d4ff3f; color: #0a0a0a; border-color: #d4ff3f; }
  .link { background: none; color: #f87171; font-size: 14px; padding: 0; }
  .badge { display: inline-block; background: #d4ff3f; color: #0a0a0a; font-weight: 700; border-radius: 999px; padding: 6px 14px; margin-bottom: 12px; font-size: 13px; }
  .alimenti { margin: 8px 0 0; padding-left: 20px; line-height: 1.6; }
  .check { display: flex; align-items: center; gap: 12px; width: 100%; background: none; color: #fff; text-align: left; font-size: 16px; padding: 8px 0; }
  .box { width: 24px; height: 24px; flex: none; border-radius: 7px; border: 2px solid rgba(255, 255, 255, 0.5); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; }
  .check.on .box { background: #d4ff3f; border-color: #d4ff3f; color: #0a0a0a; }
  .stepper { display: flex; align-items: center; gap: 12px; }
  .stepper .val { font-size: 22px; font-weight: 700; min-width: 80px; text-align: center; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid rgba(255, 255, 255, 0.15); }
  th { color: #d4d4dc; font-weight: 600; }
  .delta-up { color: #f87171; font-weight: 700; }
  .delta-down { color: #d4ff3f; font-weight: 700; }
  svg.chart { width: 100%; height: auto; display: block; }
  nav { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); display: flex; background: rgba(255, 255, 255, 0.18); -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%); border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 26px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 10px 30px rgba(0, 0, 0, 0.4); overflow: hidden; }
  nav button { flex: 1; background: none; color: rgba(255, 255, 255, 0.75); font-weight: 700; font-size: 10px; padding: 9px 0 10px; }
  nav .ic { display: block; font-size: 20px; line-height: 1.2; margin-bottom: 2px; }
  nav button.active { color: #d4ff3f; }
  .profili { display: flex; gap: 8px; margin-bottom: 4px; }
  .profili button.on { background: #d4ff3f; color: #0a0a0a; }
  /* Tema chiaro e allegro */
  html { background: #f4fff8; }
  body {
    color: #2d2a3e;
    background:
      radial-gradient(circle at 8% 2%, #cdf5df 0%, transparent 38%),
      radial-gradient(circle at 92% 30%, #cdf5e6 0%, transparent 40%),
      radial-gradient(circle at 40% 100%, #e5dcff 0%, transparent 45%),
      #f4fff8;
    background-attachment: fixed;
  }
  .muted { color: #6b6880; }
  .card {
    background: rgba(255, 255, 255, 0.82);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.95);
    box-shadow: 0 6px 22px rgba(120, 90, 150, 0.12);
    border-radius: 22px;
  }
  input { background: #ffffff; color: #2d2a3e; border: 1px solid #e6dff0; }
  input::placeholder { color: #a7a3b8; }
  label.muted { display: block; margin: 6px 0; }
  label.muted input, textarea { margin-top: 4px; }
  textarea { width: 100%; font: inherit; font-size: 16px; color: #2d2a3e; background: #fff; border: 1px solid #e6dff0; border-radius: 12px; padding: 10px 12px; box-sizing: border-box; }
  .primary { background: #22a86a; color: #ffffff; box-shadow: 0 8px 20px rgba(34, 168, 106, 0.3); }
  .small, .chip { background: #ffffff; color: #2d2a3e; border: 1px solid #efe6f5; box-shadow: 0 2px 8px rgba(120, 90, 150, 0.08); }
  .chip.on { background: #5fd3b0; color: #1e3b33; border-color: #5fd3b0; }
  .profili button.on { background: #22a86a; color: #ffffff; }
  .badge { background: #9b8cff; color: #ffffff; }
  .check { color: #2d2a3e; }
  .check .box { border-color: rgba(45, 42, 62, 0.35); }
  .check.on .box { background: #5fd3b0; border-color: #5fd3b0; color: #1e3b33; }
  .link { color: #e5484d; }
  th { color: #6b6880; }
  th, td { border-bottom: 1px solid rgba(45, 42, 62, 0.08); }
  .delta-up { color: #e5484d; }
  .delta-down { color: #2bb6c9; }
  nav {
    background: rgba(255, 255, 255, 0.9);
    border: 1px solid #efe6f5;
    box-shadow: 0 10px 30px rgba(120, 90, 150, 0.18);
  }
  nav button { color: #8a86a0; }
  nav button.active { color: #22a86a; }
  .giorni { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 8px 0 16px; }
  .giorni .chip { padding: 10px 0; font-size: 13px; text-align: center; position: relative; }
  .giorni .chip.oggi::after { content: ''; position: absolute; left: 50%; bottom: 3px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: #22a86a; }
  .giorni .chip.on.oggi::after { background: #1e3b33; }
  .opzione + .opzione { border-top: 1px dashed rgba(45, 42, 62, 0.15); margin-top: 10px; padding-top: 10px; }
  .opzione .titolo { font-size: 14px; font-weight: 700; color: #6b6880; }
</style>
</head>
<body>
<main id="app"></main>
<nav>
  <button data-tab="oggi"><span class="ic">🥗</span>OGGI</button>
  <button data-tab="settimana"><span class="ic">📅</span>SETTIMANA</button>
  <button data-tab="andamento"><span class="ic">📈</span>ANDAMENTO</button>
  <button data-tab="dati"><span class="ic">⚙️</span>DATI</button>
</nav>
<script src="vendor/pdf.min.js"></script>
<script>
  if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/pdf.worker.min.js';
  const DAYS =['Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato', 'Domenica'];
  // Valori iniziali di ogni profilo, modificabili in DATI → Impostazioni
  const OLIO_DEF = 6;   // cucchiaini al giorno
  const ACQUA_DEF = 2;  // litri al giorno
  const NOTE_DEF = 'Pane e olio puoi distribuirli come preferisci nella giornata. Puoi sostituire la frutta mantenendo la stessa porzione, ma non con la banana. Puoi invertire giornate intere, non singoli pasti.';
  const KEY = 'dieta:v1';

  const DEFAULT = {
    profili: {
      raffaele: { nome: 'Raffaele', piani: [], bia: [], dieta: {} },
      alessandra: { nome: 'Alessandra', piani: [], bia: [], dieta: {} },
    },
    attivo: 'raffaele',
  };

  let state = load();
  let tab = 'oggi';
  let giornoSel = (new Date().getDay() + 6) % 7; // giorno scelto in SETTIMANA (Lunedì = 0)
  let giornoVisto = null; // giorno mostrato in OGGI (null = oggi), per segnare anche i giorni passati
  let biaEdit = null;     // data della BIA che si sta modificando in DATI
  const visto = () => giornoVisto || todayISO();
  let vistaSett = 'giorni'; // SETTIMANA: 'giorni' oppure 'spesa'
  let pianoInAttesa = null; // schema letto dal PDF, in attesa della data di inizio

  function load() {
    try {
      const s = { ...structuredClone(DEFAULT), ...JSON.parse(localStorage.getItem(KEY) || '{}') };
      if (s.preferito && s.profili[s.preferito]) s.attivo = s.preferito;
      return s;
    } catch (e) {
      return structuredClone(DEFAULT);
    }
  }
  function save() {
    const json = JSON.stringify(state);
    localStorage.setItem(KEY, json);
    if (NATIVO) Plugin('Preferences').set({ key: KEY, value: json });
  }

  // ---------- APP PER IPHONE (Capacitor) ----------
  // Nell'app i dati vengono copiati anche nelle preferenze di iOS, che il sistema non cancella mai
  const NATIVO = !!window.Capacitor?.isNativePlatform?.();
  const Plugin = (nome) => window.Capacitor.Plugins[nome];
  async function ripristinaNativo() {
    if (!NATIVO) return;
    if (!localStorage.getItem(KEY)) {
      const { value } = await Plugin('Preferences').get({ key: KEY });
      if (value) { localStorage.setItem(KEY, value); state = load(); }
    }
    save();
    programmaPromemoria().catch(() => {});
  }
  // Nel browser scarica il file, nell'app apre il pannello Condividi (Salva su File, AirDrop, ...)
  async function condividiFile(nome, testo) {
    if (!NATIVO) {
      const url = URL.createObjectURL(new Blob([testo], { type: 'application/json' }));
      const a = document.createElement('a');
      a.href = url;
      a.download = nome;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      return;
    }
    const { uri } = await Plugin('Filesystem').writeFile({ path: nome, data: testo, directory: 'CACHE', encoding: 'utf8' });
    try { await Plugin('Share').share({ title: nome, files: [uri] }); } catch (e) { /* condivisione annullata */ }
  }

  const prof = () => state.profili[state.attivo];
  const olioTot = () => prof().olio_tot ?? OLIO_DEF;
  const acquaTot = () => prof().acqua_tot ?? ACQUA_DEF;
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = (n) => String(n).padStart(2, '0');
  const isoOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const todayISO = () => isoOf(new Date());
  const parseISO = (iso) => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); };
  const dayIdx = (iso) => (parseISO(iso).getDay() + 6) % 7; // Lunedì = 0
  const fmtDate = (iso) => `${iso.slice(8, 10)}/${iso.slice(5, 7)}/${iso.slice(0, 4)}`;
  const addDays = (iso, n) => { const d = parseISO(iso); d.setDate(d.getDate() + n); return isoOf(d); };
  const num = (v) => (v === '' || v == null || isNaN(Number(v)) ? null : Number(v));

  // Piano attivo per una data: dal <= data <= al (al vuoto = aperto)
  // Se più piani coprono la data, vince quello iniziato più di recente
  function planFor(iso) {
    const validi = prof().piani.filter((p) => p.dal <= iso && (!p.al || iso <= p.al));
    if (!validi.length) return null;
    return validi.reduce((a, b) => (b.dal > a.dal ? b : a));
  }
  function recFor(iso) {
    const r = prof().dieta[iso] || { slot: {}, olio: 0, acqua: 0 };
    prof().dieta[iso] = r;
    return r;
  }
  function slotState(iso, i) {
    const r = recFor(iso);
    return r.slot[i] || { opt: 0, fatto: false };
  }

  // ---------- SCHEMA DIETETICO DAL PDF ----------
  // Il PDF viene letto nel browser: il testo è diviso in colonne (nomi a sinistra, grammature a destra)
  const GIORNI = ['Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato', 'Domenica'];
const PASTI = ['Spuntino', 'Pranzo', 'Cena'];
const PREFISSO = { Contorno: 'Contorno: ', Secondo: 'Secondo: ' };

function parseSchema(righe) {
  // righe: [{ sinistra, destra }] in ordine di lettura
  const giorni = [];
  let giorno = null, pasto = null, opzione = null, sub = '', ignora = false;
  for (const r of righe) {
    const L = r.sinistra.trim(), R = r.destra.trim();
    if (!L) continue;
    if (L.startsWith('Avvertenze')) break;
    const g = GIORNI.find((d) => L === d || L.startsWith(d + ' '));
    if (g) {
      giorno = { nome: g, palestra: L.includes('Palestra'), pasti: [] };
      giorni.push(giorno);
      pasto = null; opzione = null; sub = ''; ignora = false;
      continue;
    }
    if (!giorno || ignora) continue;
    if (L.startsWith('Condimento')) { ignora = true; continue; }
    if (PASTI.includes(L) && !R) {
      pasto = { nome: L, opzioni: [] };
      giorno.pasti.push(pasto);
      opzione = { alimenti: [] };
      pasto.opzioni.push(opzione);
      sub = '';
      continue;
    }
    if (L === 'Oppure' && !R) {
      if (!pasto) continue;
      opzione = { alimenti: [] };
      pasto.opzioni.push(opzione);
      sub = '';
      continue;
    }
    if (L === 'Contorno' || L === 'Secondo' || L === 'Frutta') {
      sub = L === 'Frutta' ? '' : L;
      continue;
    }
    if (!pasto || !opzione) continue;
    if (L.startsWith('Olio') || L.startsWith('Acqua')) continue;
    const q = R.replace(/^\((.*)\)$/, '$1');
    // il contorno vale solo per le righe elencate con il trattino
    const pref = sub && L.startsWith('-') ? PREFISSO[sub] || '' : '';
    if (!L.startsWith('-')) sub = '';
    if (L.startsWith('-')) {
      opzione.alimenti.push({ nome: pref + L.slice(1).trim(), quantita: q });
    } else if (R) {
      opzione.alimenti.push({ nome: pref + L, quantita: q });
    } else if (opzione.alimenti.length === 0 && !opzione.titolo) {
      opzione.titolo = L;
    } else {
      opzione.alimenti.push({ nome: pref + L, quantita: '' });
    }
  }
  return giorni;
}


  async function leggiSchemaPdf(file) {
    const doc = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
    const righe = [];
    for (let p = 1; p <= doc.numPages; p++) {
      const tc = await (await doc.getPage(p)).getTextContent();
      const rows = {};
      tc.items.forEach((it) => { if (!it.str.trim()) return; const y = Math.round(it.transform[5]); (rows[y] = rows[y] || []).push(it); });
      Object.keys(rows).map(Number).sort((a, b) => b - a).forEach((y) => {
        const items = rows[y].sort((a, b) => a.transform[4] - b.transform[4]);
        let sinistra = '', destra = '', prev = null;
        items.forEach((it) => {
          const x = it.transform[4];
          const parte = x < 240 ? 'sinistra' : 'destra';
          const gap = prev ? x - (prev.x + prev.w) : 0;
          const sep = prev && prev.parte === parte && gap > 1.5 ? ' ' : '';
          if (parte === 'sinistra') sinistra += (sinistra && prev && prev.parte === 'sinistra' ? sep : '') + it.str;
          else destra += (destra && prev && prev.parte === 'destra' ? sep : '') + it.str;
          prev = { x, w: it.width, parte };
        });
        righe.push({ sinistra, destra });
      });
    }
    return parseSchema(righe);
  }

  // Aggiunge un piano: quelli aperti si chiudono il giorno prima della nuova data
  function addPiano(p) {
    prof().piani = prof().piani.filter((x) => !(x.nome === p.nome && x.dal === p.dal));
    prof().piani.forEach((old) => {
      if (old.dal < p.dal && (!old.al || old.al >= p.dal)) old.al = addDays(p.dal, -1);
    });
    prof().piani.push(p);
  }

  // ---------- OGGI ----------
  // Intestazione di OGGI con le frecce per andare ai giorni passati (non oltre oggi)
  function testaGiorno(iso) {
    const oggiIso = todayISO();
    const titolo = iso === oggiIso ? `Oggi, ${DAYS[dayIdx(iso)]}` : iso === addDays(oggiIso, -1) ? `Ieri, ${DAYS[dayIdx(iso)]}` : DAYS[dayIdx(iso)];
    return `
      <div class="between">
        <button class="small" data-sposta="-1" aria-label="Giorno precedente">‹</button>
        <h1 style="margin: 0; text-align: center">${titolo}</h1>
        <button class="small" data-sposta="1" aria-label="Giorno successivo" ${iso >= oggiIso ? 'disabled style="visibility: hidden"' : ''}>›</button>
      </div>
      ${iso !== oggiIso ? '<button class="link" data-sposta="0" style="color: #22a86a; display: block; margin: 8px auto 0">Torna a oggi</button>' : ''}`;
  }

  function oggi() {
    const iso = visto();
    const piano = planFor(iso);
    if (!piano) {
      return `
        ${testaGiorno(iso)}
        <p class="muted">${fmtDate(iso)}</p>
        <div class="card">
          <strong>Nessun piano attivo per questo giorno.</strong>
          <p class="muted">Carica lo schema PDF dalla scheda Dati.</p>
          <button class="small" data-tab="dati">Vai a Dati</button>
        </div>`;
    }
    const giorno = piano.giorni[dayIdx(iso)];
    const r = recFor(iso);
    const pasti = giorno.pasti.map((pasto, i) => {
      const st = slotState(iso, i);
      const opt = pasto.opzioni[st.opt] || pasto.opzioni[0];
      const alternative = pasto.opzioni.length > 1
        ? `<div class="row">${pasto.opzioni.map((o, j) => `
            <button class="chip ${j === st.opt ? 'on' : ''}" data-opt="${i}:${j}">${esc(o.titolo || 'Opzione ' + (j + 1))}</button>
`).join('')}</div>`
        : '';
      return `
        <div class="card">
          <div class="between">
            <strong>${esc(pasto.nome)}</strong>
            <button class="chip ${st.fatto ? 'on' : ''}" data-fatto="${i}">${st.fatto ? '✓ Fatto' : 'Segna'}</button>
          </div>
          ${alternative}
          <ul class="alimenti">${opt.alimenti.map((a) => `<li>${esc(a.nome)} <span class="muted">${esc(a.quantita)}</span></li>`).join('')}</ul>
        </div>`;
    }).join('');
    return `
      ${testaGiorno(iso)}
      <p class="muted">${fmtDate(iso)} · ${esc(piano.nome)}</p>
      ${giorno.palestra ? '<span class="badge">Giorno di palestra</span>' : ''}
      ${pasti}
      <h2>Olio e acqua</h2>
      <div class="card">
        <div class="between">
          <strong>Olio extra vergine</strong>
          <div class="stepper">
            <button class="small" data-olio="-1">−</button>
            <span class="val">${r.olio} / ${olioTot()}</span>
            <button class="small" data-olio="1">+</button>
          </div>
        </div>
        <p class="muted">cucchiaini, da distribuire nella giornata</p>
      </div>
      <div class="card">
        <div class="between">
          <strong>Acqua</strong>
          <div class="stepper">
            <button class="small" data-acqua="-0.25">−</button>
            <span class="val">${r.acqua.toFixed(2)} / ${acquaTot()} L</span>
            <button class="small" data-acqua="0.25">+</button>
          </div>
        </div>
        <p class="muted">Un bicchiere è circa 0,25 L</p>
      </div>
      ${(prof().note ?? NOTE_DEF) ? `<p class="muted">${esc(prof().note ?? NOTE_DEF)}</p>` : ''}`;
  }

  // ---------- SETTIMANA ----------
  // Lo schema è fisso: mostra i pasti di ogni giorno del piano attivo oggi, con tutte le alternative
  function settimana() {
    const oggiIdx = dayIdx(todayISO());
    const piano = planFor(todayISO());
    if (!piano) {
      return `
        <h1>Settimana</h1>
        <div class="card">
          <strong>Nessun piano attivo.</strong>
          <p class="muted">Carica lo schema PDF dalla scheda Dati.</p>
          <button class="small" data-tab="dati">Vai a Dati</button>
        </div>`;
    }
    const viste = `
      <div class="row">
        <button class="chip ${vistaSett === 'giorni' ? 'on' : ''}" data-vistasett="giorni">Giorni</button>
        <button class="chip ${vistaSett === 'spesa' ? 'on' : ''}" data-vistasett="spesa">🛒 Lista della spesa</button>
      </div>`;
    if (vistaSett === 'spesa') return `<h1>Settimana</h1>${viste}${listaSpesa()}`;
    const giorno = piano.giorni[giornoSel];
    const chips = DAYS.map((nome, i) => `
      <button class="chip ${i === giornoSel ? 'on' : ''} ${i === oggiIdx ? 'oggi' : ''}" data-giorno="${i}">${nome.slice(0, 3)}</button>`).join('');
    const pasti = giorno.pasti.map((pasto) => `
      <div class="card">
        <strong>${esc(pasto.nome)}</strong>
        ${pasto.opzioni.map((o, j) => `
          <div class="opzione">
            ${pasto.opzioni.length > 1 ? `<div class="titolo">${esc(o.titolo || 'Opzione ' + (j + 1))}</div>` : ''}
            <ul class="alimenti">${o.alimenti.map((a) => `<li>${esc(a.nome)} <span class="muted">${esc(a.quantita)}</span></li>`).join('')}</ul>
          </div>`).join('')}
      </div>`).join('');
    return `
      <h1>Settimana</h1>
      ${viste}
      <p class="muted">${esc(piano.nome)}</p>
      <div class="giorni">${chips}</div>
      <h2>${DAYS[giornoSel]}${giornoSel === oggiIdx ? ' · oggi' : ''}</h2>
      ${giorno.palestra ? '<span class="badge">Giorno di palestra</span>' : ''}
      ${pasti}`;
  }

  // ---------- LISTA DELLA SPESA ----------
  // Somma gli alimenti della settimana in corso (da lunedì a domenica): per ogni pasto vale l'alternativa
  // scelta in OGGI, altrimenti la prima. Le quantità in g, ml, kg o l si sommano, le altre si contano
  const lunediDi = (iso) => addDays(iso, -dayIdx(iso));
  function vociSpesa() {
    const lun = lunediDi(todayISO());
    const voci = {};
    for (let i = 0; i < 7; i++) {
      const iso = addDays(lun, i);
      const piano = planFor(iso);
      if (!piano) continue;
      piano.giorni[i].pasti.forEach((pasto, j) => {
        const scelta = prof().dieta[iso]?.slot?.[j]?.opt ?? 0;
        const opz = pasto.opzioni[scelta] || pasto.opzioni[0];
        opz.alimenti.forEach((a) => {
          const pulito = a.nome.replace(/^(Contorno|Secondo): /, '').trim();
          const nome = pulito.charAt(0).toUpperCase() + pulito.slice(1);
          const k = nome.toLowerCase();
          const v = (voci[k] = voci[k] || { nome, unita: {}, volte: 0 });
          v.volte++;
          const q = String(a.quantita || '').match(/^(\d+(?:[.,]\d+)?)\s*(g|gr|ml|kg|l)\b/i);
          if (q) { const u = q[2].toLowerCase() === 'gr' ? 'g' : q[2].toLowerCase(); v.unita[u] = (v.unita[u] || 0) + parseFloat(q[1].replace(',', '.')); }
        });
      });
    }
    return Object.entries(voci).sort((a, b) => a[1].nome.localeCompare(b[1].nome, 'it')).map(([k, v]) => {
      const tot = Object.entries(v.unita).map(([u, n]) => `${String(Math.round(n * 10) / 10).replace('.', ',')} ${u}`).join(' + ');
      return { k, nome: v.nome, quanto: tot ? `${tot} (${v.volte} ${v.volte === 1 ? 'volta' : 'volte'})` : `${v.volte} ${v.volte === 1 ? 'volta' : 'volte'}` };
    });
  }
  // Spunte della lista: valgono per la settimana in corso, poi ripartono da zero
  function spuntaSpesa() {
    const lun = lunediDi(todayISO());
    if (!prof().spesa || prof().spesa.settimana !== lun) prof().spesa = { settimana: lun, presi: {} };
    return prof().spesa.presi;
  }
  function listaSpesa() {
    const voci = vociSpesa();
    if (!voci.length) return '<div class="card"><p class="muted">Nessun piano attivo questa settimana.</p></div>';
    const presi = spuntaSpesa();
    const lun = lunediDi(todayISO());
    return `
      <p class="muted">Settimana dal ${fmtDate(lun)} al ${fmtDate(addDays(lun, 6))}. Per ogni pasto conta l'alternativa scelta in OGGI, altrimenti la prima.</p>
      <div class="card">
        ${voci.map((v) => `
          <button class="check ${presi[v.k] ? 'on' : ''}" data-preso="${esc(v.k)}">
            <span class="box">${presi[v.k] ? '✓' : ''}</span>
            <span>${esc(v.nome)}<br><span class="muted">${esc(v.quanto)}</span></span>
          </button>`).join('')}
      </div>
      <div class="row">
        <button class="small" data-condividispesa="1">Condividi lista</button>
        <button class="small" data-azzeraspesa="1">Togli le spunte</button>
      </div>`;
  }
  async function condividiSpesa() {
    const presi = spuntaSpesa();
    const testo = 'Lista della spesa\n' + vociSpesa().filter((v) => !presi[v.k]).map((v) => `- ${v.nome}: ${v.quanto}`).join('\n');
    try {
      if (NATIVO) await Plugin('Share').share({ title: 'Lista della spesa', text: testo });
      else if (navigator.share) await navigator.share({ title: 'Lista della spesa', text: testo });
      else { await navigator.clipboard.writeText(testo); alert('Lista copiata: incollala dove vuoi.'); }
    } catch (e) { /* condivisione annullata */ }
  }

  // ---------- ANDAMENTO ----------
  function sparkline(values, color, h = 120) {
    if (values.length < 2) return '';
    const w = 320, pad2 = 16;
    const min = Math.min(...values), max = Math.max(...values);
    const range = max - min || 1;
    const pts = values.map((v, i) => {
      const x = pad2 + (i * (w - 2 * pad2)) / (values.length - 1);
      const y = h - pad2 - ((v - min) / range) * (h - 2 * pad2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    return `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
  }

  function aderenza() {
    let tot = 0, fatti = 0;
    const oggiIso = todayISO();
    for (let k = 7; k >= 1; k--) { // da 7 giorni fa a ieri: oggi è ancora in corso
      const iso = addDays(oggiIso, -k);
      const piano = planFor(iso);
      if (!piano) continue;
      const giorno = piano.giorni[dayIdx(iso)];
      giorno.pasti.forEach((_, i) => {
        tot++;
        if (slotState(iso, i).fatto) fatti++;
      });
    }
    return tot ? Math.round((fatti / tot) * 100) : null;
  }

  // Grafico con più serie: ogni linea ha la sua scala (peso e massa grassa hanno ordini di grandezza diversi),
  // ogni serie occupa una fascia e mostra il valore iniziale e finale; sotto, le date della prima e ultima misura
  function multiChart(series, date) {
    const valide = series.filter((x) => x.values.filter((v) => v != null).length > 1);
    if (!valide.length) return '<p class="muted">Servono almeno due misurazioni per il grafico.</p>';
    const fascia = 56, w = 320, padX = 40, h = fascia * valide.length + 8;
    const n = date.length;
    const xOf = (i) => padX + (i * (w - 2 * padX)) / Math.max(n - 1, 1);
    const fmtV = (v) => String(v).replace('.', ',');
    const linee = valide.map((x, s) => {
      const nums = x.values.filter((v) => v != null);
      const min = Math.min(...nums), range = Math.max(...nums) - min || 1;
      const top = s * fascia + 14, alt = fascia - 24;
      const pts = x.values.map((v, i) => (v == null ? null : [xOf(i), top + alt - ((v - min) / range) * alt])).filter(Boolean);
      const primo = pts[0], ultimo = pts[pts.length - 1];
      return `<polyline points="${pts.map((p) => p.map((c) => c.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="${x.color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        ${pts.map(([px, py]) => `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="3" fill="${x.color}"/>`).join('')}
        <text x="${primo[0] - 6}" y="${primo[1] + 4}" text-anchor="end" font-size="11" font-weight="700" fill="${x.color}">${fmtV(nums[0])}</text>
        <text x="${ultimo[0] + 6}" y="${ultimo[1] + 4}" font-size="11" font-weight="700" fill="${x.color}">${fmtV(nums[nums.length - 1])}</text>`;
    }).join('');
    const legenda = valide.map((x) => `<span style="color:${x.color};font-weight:700">● ${x.nome}</span>`).join(' &nbsp; ');
    return `<svg class="chart" viewBox="0 0 ${w} ${h}">${linee}</svg>
      <div class="between muted"><span>${fmtDate(date[0])}</span><span>${fmtDate(date[n - 1])}</span></div>
      <p class="muted">${legenda}</p>`;
  }

  function andamento() {
    const bia = [...prof().bia].sort((a, b) => a.data.localeCompare(b.data));
    const ad = aderenza();
    const adHtml = ad == null
      ? '<p class="muted">Nessun piano attivo negli ultimi 7 giorni.</p>'
      : `<p>Hai segnato il <strong>${ad}%</strong> dei pasti negli ultimi 7 giorni (oggi escluso).</p>`;
    if (!bia.length) {
      return `
        <h1>Andamento</h1>
        <div class="card">${adHtml}</div>
        <div class="card"><strong>Nessuna misurazione.</strong><p class="muted">Carica la BIA in PDF dalla scheda Dati.</p></div>`;
    }
    const primo = bia[0], ultimo = bia[bia.length - 1];
    const prec = bia.length > 1 ? bia[bia.length - 2] : null;
    const voci = [
      { k: 'peso', nome: 'Peso', u: 'kg', verso: -1 },
      { k: 'grasso_kg', nome: 'Massa grassa', u: 'kg', verso: -1 },
      { k: 'magra_kg', nome: 'Massa magra', u: 'kg', verso: 1 },
      { k: 'vita_cm', nome: 'Vita', u: 'cm', verso: -1 },
      { k: 'addome_cm', nome: 'Addome', u: 'cm', verso: -1 },
      { k: 'fianchi_cm', nome: 'Fianchi', u: 'cm', verso: -1 },
    ];
    const val = (m, k) => (m[k] == null ? '–' : String(m[k]).replace('.', ','));
    const diff = (a, b, k) => (a && b && a[k] != null && b[k] != null ? +(b[k] - a[k]).toFixed(1) : null);
    const fmtD = (d, u, verso) => {
      if (d == null) return '–';
      const bene = d * verso > 0;
      const cls = d === 0 ? '' : bene ? 'delta-down' : 'delta-up';
      return `<span class="${cls}">${d > 0 ? '+' : ''}${String(d).replace('.', ',')} ${u}</span>`;
    };

    // Riepilogo automatico
    const consigli = [];
    const dGrasso = diff(primo, ultimo, 'grasso_kg');
    const dMagra = diff(primo, ultimo, 'magra_kg');
    if (dGrasso != null && dMagra != null) {
      if (dGrasso < 0 && dMagra >= -0.5) consigli.push('Dall\'inizio il calo riguarda soprattutto la massa grassa, e la massa magra è stabile: è il risultato che cerchiamo.');
      if (dMagra < -1) consigli.push('La massa magra è scesa di più di 1 kg: conviene parlarne con la nutrizionista.');
      if (dGrasso > 0) consigli.push('La massa grassa è salita rispetto all\'inizio.');
    }
    const dPrec = prec ? [
      `Peso ${fmtD(diff(prec, ultimo, 'peso'), 'kg', -1)}`,
      `massa grassa ${fmtD(diff(prec, ultimo, 'grasso_kg'), 'kg', -1)}`,
      `vita ${fmtD(diff(prec, ultimo, 'vita_cm'), 'cm', -1)}`,
    ].join(' · ') : '';

    const tabellaDiff = voci.map((v) => `
      <tr>
        <th>${v.nome}</th>
        <td>${val(primo, v.k)} → ${val(ultimo, v.k)} ${v.u}</td>
        <td>${fmtD(diff(primo, ultimo, v.k), v.u, v.verso)}</td>
      </tr>`).join('');

    const righe = [...bia].reverse().map((m) => `
      <tr>
        <td style="white-space: nowrap">${fmtDate(m.data)}<br>
          <button class="small mini" data-editbia="${m.data}" aria-label="Modifica">✎</button>
          <button class="small mini" data-delbia="${m.data}" aria-label="Elimina">✕</button>
        </td>
        <td>${val(m, 'peso')}</td>
        <td>${val(m, 'grasso_kg')}</td>
        <td>${val(m, 'magra_kg')}</td>
        <td>${val(m, 'vita_cm')}</td>
        <td>${val(m, 'addome_cm')}</td>
        <td>${val(m, 'fianchi_cm')}</td>
      </tr>`).join('');

    const obiettivi = ultimo.obiettivo_peso != null || ultimo.obiettivo_grasso_pct != null
      ? `<p class="muted">Obiettivi: peso ${val(ultimo, 'obiettivo_peso')} kg, massa grassa ${val(ultimo, 'obiettivo_grasso_pct')}%</p>` : '';

    return `
      <h1>Andamento</h1>
      <div class="card">
        ${adHtml}
        ${dPrec ? `<p><strong>Dall'ultima misurazione (${fmtDate(prec.data)}):</strong><br>${dPrec}</p>` : ''}
        ${consigli.map((c) => `<p>• ${c}</p>`).join('')}
      </div>
      <h2>Dall'inizio: ${fmtDate(primo.data)} → ${fmtDate(ultimo.data)}</h2>
      <div class="card">
        <table>${tabellaDiff}</table>
        ${obiettivi}
      </div>
      <h2>Peso e composizione</h2>
      <div class="card">
        ${multiChart([
          { nome: 'Peso', color: '#9b8cff', values: bia.map((m) => m.peso) },
          { nome: 'Massa grassa', color: '#22a86a', values: bia.map((m) => m.grasso_kg) },
          { nome: 'Massa magra', color: '#2bb6c9', values: bia.map((m) => m.magra_kg) },
        ], bia.map((m) => m.data))}
      </div>
      <h2>Centimetri</h2>
      <div class="card">
        ${multiChart([
          { nome: 'Vita', color: '#22a86a', values: bia.map((m) => m.vita_cm) },
          { nome: 'Addome', color: '#9b8cff', values: bia.map((m) => m.addome_cm) },
          { nome: 'Fianchi', color: '#2bb6c9', values: bia.map((m) => m.fianchi_cm) },
        ], bia.map((m) => m.data))}
      </div>
      <h2>Storico misurazioni</h2>
      <div class="card" style="overflow-x: auto">
        <table>
          <tr><th>Data</th><th>Peso</th><th>Grasso</th><th>Magra</th><th>Vita</th><th>Addome</th><th>Fianchi</th></tr>
          ${righe}
        </table>
      </div>`;
  }

  // ---------- IMPOSTAZIONI ----------
  const ORE_ACQUA = [10, 12, 14, 16, 18, 20];
  const ID_ACQUA = 10, ID_PASTI = 20; // id delle notifiche: 10–15 acqua, 20 pasti
  function impostazioni() {
    const ids = Object.keys(state.profili);
    const pr = state.promemoria || {};
    const profili = ids.map((id) => `
      <div class="between" style="padding: 6px 0">
        <span><strong>${esc(state.profili[id].nome)}</strong>${id === state.preferito ? ' <span class="muted">· si apre all\'avvio</span>' : ''}</span>
        <span style="white-space: nowrap">
          <button class="small mini" data-prefprofilo="${id}" aria-label="Apri all'avvio">${id === state.preferito ? '★' : '☆'}</button>
          <button class="small mini" data-rinomina="${id}" aria-label="Rinomina">✎</button>
          ${ids.length > 1 ? `<button class="small mini" data-delprofilo="${id}" aria-label="Elimina">✕</button>` : ''}
        </span>
      </div>`).join('');
    return `
      <h2>Profili</h2>
      <div class="card">
        ${profili}
        <p class="muted">★ = profilo che si apre all'avvio.</p>
        <button class="small" data-nuovoprofilo="1">Aggiungi profilo</button>
      </div>
      <h2>Impostazioni di ${esc(prof().nome)}</h2>
      <div class="card">
        <div class="grid2">
          <label class="muted">Olio (cucchiaini al giorno)<input inputmode="numeric" id="s_olio" value="${olioTot()}"></label>
          <label class="muted">Acqua (litri al giorno)<input inputmode="decimal" id="s_acqua" value="${String(acquaTot()).replace('.', ',')}"></label>
        </div>
        <label class="muted">Note in fondo a OGGI<textarea id="s_note" rows="4">${esc(prof().note ?? NOTE_DEF)}</textarea></label>
        <button class="primary" data-salvaimpost="1">Salva impostazioni</button>
      </div>
      <h2>Promemoria</h2>
      <div class="card">
        ${NATIVO ? `
          <button class="check ${pr.acqua ? 'on' : ''}" data-promemoria="acqua"><span class="box">${pr.acqua ? '✓' : ''}</span><span>Bevi acqua<br><span class="muted">alle ${ORE_ACQUA.join(', ')}</span></span></button>
          <button class="check ${pr.pasti ? 'on' : ''}" data-promemoria="pasti"><span class="box">${pr.pasti ? '✓' : ''}</span><span>Segna i pasti<br><span class="muted">ogni sera alle 21</span></span></button>`
        : '<p class="muted">I promemoria sono disponibili nell\'app per iPhone.</p>'}
      </div>`;
  }
  // Riprogramma le notifiche giornaliere secondo le impostazioni (solo nell'app)
  async function programmaPromemoria() {
    if (!NATIVO) return;
    const LN = Plugin('LocalNotifications');
    const pr = state.promemoria || {};
    await LN.cancel({ notifications: [...ORE_ACQUA.map((_, i) => ({ id: ID_ACQUA + i })), { id: ID_PASTI }] });
    const n = [];
    if (pr.acqua) ORE_ACQUA.forEach((h, i) => n.push({ id: ID_ACQUA + i, title: 'Acqua 💧', body: 'È il momento di un bicchiere d\'acqua.', schedule: { on: { hour: h, minute: 0 }, allowWhileIdle: true } }));
    if (pr.pasti) n.push({ id: ID_PASTI, title: 'Dieta', body: 'Hai segnato i pasti di oggi?', schedule: { on: { hour: 21, minute: 0 }, allowWhileIdle: true } });
    if (n.length) await LN.schedule({ notifications: n });
  }

  // ---------- DATI ----------
  // Campi della misurazione a mano: id del campo, chiave salvata, etichetta, tastiera
  const CAMPI_BIA = [
    ['b_peso', 'peso', 'Peso (kg)', 'decimal'],
    ['b_grasso', 'grasso_kg', 'Massa grassa (kg)', 'decimal'],
    ['b_magra', 'magra_kg', 'Massa magra (kg)', 'decimal'],
    ['b_acqua', 'acqua_l', 'Acqua (l)', 'decimal'],
    ['b_bmr', 'bmr', 'Metabolismo (kcal)', 'numeric'],
    ['b_vat', 'vat_cm2', 'Grasso viscerale (cm²)', 'numeric'],
    ['b_vita', 'vita_cm', 'Vita (cm)', 'decimal'],
    ['b_addome', 'addome_cm', 'Addome (cm)', 'decimal'],
    ['b_fianchi', 'fianchi_cm', 'Fianchi (cm)', 'decimal'],
    ['b_torace', 'torace_cm', 'Torace (cm)', 'decimal'],
  ];
  function dati() {
    const piani = prof().piani.length
      ? prof().piani.map((p, i) => ({ p, i })).sort((a, b) => a.p.dal.localeCompare(b.p.dal)).map(({ p, i }) => `
          <div class="card">
            <div class="between">
              <div><strong>${esc(p.nome)}</strong><p class="muted">${fmtDate(p.dal)} → ${p.al ? fmtDate(p.al) : 'aperto'}</p></div>
              <button class="link" data-delpiano="${i}">Elimina</button>
            </div>
          </div>`).join('')
      : '<p class="muted">Nessun piano importato.</p>';
    const oggiIso = todayISO();
    const ed = biaEdit ? prof().bia.find((x) => x.data === biaEdit) : null;
    const attesa = pianoInAttesa ? `
      <div class="card" id="attesa" style="border: 2px solid #22a86a">
        <strong>Schema letto: ${esc(pianoInAttesa.nome)}</strong>
        <p class="muted">Da quale giorno vale? Il piano precedente si chiude il giorno prima.</p>
        <input type="date" id="dalPiano" value="${oggiIso}">
        <div class="row">
          <button class="primary" data-confermapiano="1" style="flex: 1; margin: 0">Salva piano</button>
          <button class="small" data-annullapiano="1">Annulla</button>
        </div>
      </div>` : '';
    return `
      <h1>Dati</h1>
      ${attesa}
      <h2>Piani alimentari</h2>
      ${piani}
      <h2>Schema dietetico</h2>
      <div class="card">
        <p class="muted">Carica il PDF dello schema: viene letto e diventa una tabella in OGGI, con i pasti del giorno e le alternative.</p>
        <button class="primary" data-pdfup="1">Carica schema PDF</button>
        <input type="file" id="pdfFile" accept="application/pdf,.pdf" style="display: none">
      </div>
      <h2>BIA in PDF</h2>
      <div class="card">
        <p class="muted">Carica il referto BIA in PDF: i valori vengono letti e salvati in ANDAMENTO, dopo la tua conferma.</p>
        <button class="primary" data-biaup="1">Carica BIA PDF</button>
        <input type="file" id="biaFile" accept="application/pdf,.pdf" style="display: none">
      </div>
      <h2 id="formBia">${biaEdit ? `Modifica misurazione del ${fmtDate(biaEdit)}` : 'Aggiungi misurazione BIA'}</h2>
      <div class="card">
        <div class="grid2">
          <input type="date" id="b_data" value="${biaEdit || oggiIso}" ${biaEdit ? 'disabled' : ''}>
          ${CAMPI_BIA.map(([id, k, ph, mode]) => `<input inputmode="${mode}" id="${id}" placeholder="${ph}" value="${ed && ed[k] != null ? String(ed[k]).replace('.', ',') : ''}">`).join('')}
        </div>
        <button class="primary" data-savebia="1">Salva misurazione</button>
        ${biaEdit ? '<button class="small" data-annullabia="1">Annulla modifica</button>' : ''}
      </div>
      ${impostazioni()}
      <h2>Backup</h2>
      <div class="card">
        <p class="muted">I dati restano sul telefono. Esporta ogni tanto un backup, e importalo per passare dalla web app all'app (o se cambi telefono).</p>
        <div class="row">
          <button class="small" data-export="1">Esporta backup</button>
          <button class="small" data-import="1">Importa backup</button>
        </div>
        <input type="file" id="importFile" accept="application/json,.json" style="display: none">
      </div>`;
  }

  // ---------- BIA DAI PDF ----------
  // Legge i valori dal referto impedenziometrico (testo estratto riga per riga)
  function parseBia(rawText) {
    const text = rawText.split('\n').map((l) => l.replace(/\s*\|\s*/g, ' ').replace(/\s+/g, ' ').trim()).join('\n');
    const num = (x) => parseFloat(String(x).replace(',', '.'));
    const one = (re) => { const m = text.match(re); return m ? num(m[1]) : null; };
    const data = text.match(/VISITA DEL (\d{2})\/(\d{2})\/(\d{4})/);
    return {
      data: data ? `${data[3]}-${data[2]}-${data[1]}` : null,
      peso: one(/\bPeso: ([\d.,]+) kg/),
      grasso_kg: one(/FAT \(Massa Grassa\): ([\d.,]+) kg/),
      grasso_pct: one(/FAT \(Massa Grassa\): [\d.,]+ kg ([\d.,]+)/),
      magra_kg: one(/FFM \(Massa Magra\): ([\d.,]+) kg/),
      magra_pct: one(/FFM \(Massa Magra\): [\d.,]+ kg ([\d.,]+)/),
      acqua_l: one(/TBW \(Acqua Corporea Totale\): ([\d.,]+) lt/),
      bmr: one(/BMR \(Metabolismo Basale\): ([\d.,]+) kcal/),
      vat_cm2: one(/Viscerale \(VAT\): ([\d.,]+) cm/),
      vita_cm: one(/Circonferenza vita: ([\d.,]+) cm/),
      addome_cm: one(/Circonferenza addominale: ([\d.,]+) cm/),
      fianchi_cm: one(/Circonferenza fianchi: ([\d.,]+) cm/),
      torace_cm: one(/Circonferenza torace: ([\d.,]+) cm/),
      obiettivo_peso: one(/Peso Desiderabile: ([\d.,]+) kg/),
      obiettivo_grasso_pct: one(/FAT Desiderabile: ([\d.,]+)\s*%/),
    };
  }
  async function leggiBiaPdf(file) {
    const doc = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
    const out = [];
    for (let p = 1; p <= doc.numPages; p++) {
      const tc = await (await doc.getPage(p)).getTextContent();
      const rows = {};
      tc.items.forEach((it) => { const y = Math.round(it.transform[5]); (rows[y] = rows[y] || []).push({ x: it.transform[4], s: it.str }); });
      Object.keys(rows).map(Number).sort((a, b) => b - a).forEach((y) => out.push(rows[y].sort((a, b) => a.x - b.x).map((i) => i.s).join(' | ')));
    }
    return parseBia(out.join('\n'));
  }

  // ---------- RENDER ----------
  // Ridisegna la pagina; in cima solo al cambio di scheda o profilo, altrimenti resta dove sei
  function render(inCima = false) {
    const y = window.scrollY;
    const ordine = Object.keys(state.profili).sort((a, b) => (a === state.preferito ? -1 : b === state.preferito ? 1 : 0));
    const profili = ordine.length > 1
      ? `<div class="profili">${ordine.map((id) => `<button class="chip ${id === state.attivo ? 'on' : ''}" data-profilo="${id}">${esc(state.profili[id].nome)}</button>`).join('')}</div>`
      : '';
    const corpo = tab === 'oggi' ? oggi() : tab === 'settimana' ? settimana() : tab === 'andamento' ? andamento() : dati();
    document.getElementById('app').innerHTML = `${profili}${corpo}`;
    document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab));
    window.scrollTo(0, inCima ? 0 : y);
  }

  // Modifica un piano o una misura, poi salva e ridisegna
  function setSlot(iso, i, patch) {
    const r = recFor(iso);
    r.slot[i] = { ...slotState(iso, i), ...patch };
    save();
    render();
  }

  document.addEventListener('click', async (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    const d = b.dataset;

    if (d.tab) {
      if (d.tab === 'settimana' && tab !== 'settimana') giornoSel = dayIdx(todayISO());
      if (d.tab === 'oggi' && tab !== 'oggi') giornoVisto = null;
      if (d.tab !== 'dati') biaEdit = null;
      tab = d.tab; return render(true);
    }
    if (d.sposta !== undefined) {
      const n = Number(d.sposta);
      const nuovo = n === 0 ? todayISO() : addDays(visto(), n);
      giornoVisto = nuovo >= todayISO() ? null : nuovo;
      return render(true);
    }
    if (d.giorno !== undefined) { giornoSel = Number(d.giorno); return render(); }
    if (d.profilo) { state.attivo = d.profilo; biaEdit = null; save(); return render(true); }
    if (d.prefprofilo) {
      state.preferito = state.preferito === d.prefprofilo ? null : d.prefprofilo;
      save(); return render();
    }
    if (d.nuovoprofilo) {
      const nome = (prompt('Nome del nuovo profilo') || '').trim();
      if (!nome) return;
      const id = 'p' + Date.now();
      state.profili[id] = { nome, piani: [], bia: [], dieta: {} };
      state.attivo = id;
      save(); return render();
    }
    if (d.rinomina) {
      const nome = (prompt('Nuovo nome', state.profili[d.rinomina].nome) || '').trim();
      if (!nome) return;
      state.profili[d.rinomina].nome = nome;
      save(); return render();
    }
    if (d.delprofilo) {
      const p = state.profili[d.delprofilo];
      if (!confirm(`Eliminare il profilo ${p.nome} con piani, pasti e misurazioni? Non si può annullare.`)) return;
      delete state.profili[d.delprofilo];
      if (state.preferito === d.delprofilo) state.preferito = null;
      if (state.attivo === d.delprofilo) state.attivo = Object.keys(state.profili)[0];
      save(); return render();
    }
    if (d.salvaimpost) {
      const olio = parseInt(document.getElementById('s_olio').value, 10);
      const acqua = parseFloat(document.getElementById('s_acqua').value.replace(',', '.'));
      if (!(olio >= 0) || !(acqua > 0)) return alert('Controlla olio e acqua: servono numeri validi.');
      prof().olio_tot = olio;
      prof().acqua_tot = acqua;
      prof().note = document.getElementById('s_note').value.trim();
      save(); render();
      return alert('Impostazioni salvate.');
    }
    if (d.promemoria) {
      state.promemoria = { ...(state.promemoria || {}), [d.promemoria]: !(state.promemoria || {})[d.promemoria] };
      if (state.promemoria[d.promemoria]) {
        const { display } = await Plugin('LocalNotifications').requestPermissions();
        if (display !== 'granted') {
          state.promemoria[d.promemoria] = false;
          return alert('Per i promemoria consenti le notifiche in Impostazioni → Notifiche → Dieta.');
        }
      }
      save(); render();
      return programmaPromemoria().catch(() => {});
    }
    if (d.vistasett) { vistaSett = d.vistasett; return render(true); }
    if (d.preso) { const pr = spuntaSpesa(); pr[d.preso] = !pr[d.preso]; save(); return render(); }
    if (d.azzeraspesa) { prof().spesa = null; save(); return render(); }
    if (d.condividispesa) return condividiSpesa();
    if (d.confermapiano) {
      const dal = document.getElementById('dalPiano').value;
      if (!dal) return alert('Scegli la data di inizio.');
      addPiano({ ...pianoInAttesa, dal, al: '' });
      pianoInAttesa = null;
      save();
      tab = 'oggi'; giornoVisto = null;
      return render(true);
    }
    if (d.annullapiano) { pianoInAttesa = null; return render(); }

    const iso = visto();
    if (d.fatto !== undefined) { const i = Number(d.fatto); return setSlot(iso, i, { fatto: !slotState(iso, i).fatto }); }
    if (d.opt !== undefined) { const [i, j] = d.opt.split(':').map(Number); return setSlot(iso, i, { opt: j }); }
    if (d.olio !== undefined) {
      const r = recFor(iso);
      r.olio = Math.min(olioTot(), Math.max(0, r.olio + Number(d.olio)));
      save(); return render();
    }
    if (d.acqua !== undefined) {
      const r = recFor(iso);
      r.acqua = Math.min(acquaTot(), Math.max(0, Math.round((r.acqua + Number(d.acqua)) * 100) / 100));
      save(); return render();
    }

    if (d.delpiano !== undefined) {
      const p = prof().piani[Number(d.delpiano)];
      if (!confirm(`Eliminare il piano "${p.nome}"? I pasti già segnati restano.`)) return;
      prof().piani.splice(Number(d.delpiano), 1);
      save(); return render();
    }
    if (d.savebia !== undefined) {
      const data = biaEdit || document.getElementById('b_data').value;
      const vecchia = prof().bia.find((x) => x.data === data);
      // In modifica si parte dalla misura esistente, così restano i valori letti dal PDF che il modulo non mostra
      const m = { ...(biaEdit ? vecchia : {}), data };
      CAMPI_BIA.forEach(([id, k]) => { m[k] = num(String(document.getElementById(id).value).replace(',', '.')); });
      if (!data || m.peso == null) return alert('Inserisci almeno la data e il peso.');
      if (!biaEdit && vecchia && !confirm(`C'è già una misurazione del ${fmtDate(data)}: la sostituisco?`)) return;
      mergeBia([m]);
      biaEdit = null;
      save();
      tab = 'andamento';
      return render(true);
    }
    if (d.editbia) { biaEdit = d.editbia; tab = 'dati'; render(); document.getElementById('formBia').scrollIntoView(); return; }
    if (d.annullabia) { biaEdit = null; return render(); }
    if (d.delbia) {
      if (!confirm(`Eliminare la misurazione del ${fmtDate(d.delbia)}?`)) return;
      prof().bia = prof().bia.filter((x) => x.data !== d.delbia);
      save(); return render();
    }
    if (d.biaup !== undefined) { document.getElementById('biaFile').click(); return; }
    if (d.pdfup !== undefined) { document.getElementById('pdfFile').click(); return; }
    if (d.export !== undefined) return condividiFile(`dieta-backup-${todayISO()}.json`, JSON.stringify(state, null, 2));
    if (d.import !== undefined) { document.getElementById('importFile').click(); return; }
  });

  // Aggiunge o aggiorna misure BIA, senza duplicati per data
  function mergeBia(misure) {
    misure.forEach((m) => {
      prof().bia = prof().bia.filter((x) => x.data !== m.data);
      prof().bia.push(m);
    });
  }

  // Carica una BIA in PDF: legge i valori, chiede conferma e li salva
  document.addEventListener('change', async (e) => {
    if (e.target.id !== 'biaFile') return;
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try {
      const m = await leggiBiaPdf(file);
      if (!m.data || m.peso == null) return alert('Non riesco a leggere i valori da questo PDF. Controlla che sia il referto BIA.');
      const ok = confirm(`Aggiungo la BIA del ${fmtDate(m.data)}?\nPeso ${String(m.peso).replace('.', ',')} kg · massa grassa ${String(m.grasso_kg).replace('.', ',')} kg · vita ${m.vita_cm ?? '–'} cm`);
      if (!ok) return;
      mergeBia([m]);
      save();
      render();
      alert('BIA salvata. La trovi in ANDAMENTO.');
    } catch (err) {
      alert('Non riesco a leggere questo PDF.');
    }
  });

  // Carica lo schema PDF: dopo la lettura si sceglie da quando vale
  document.addEventListener('change', async (e) => {
    if (e.target.id !== 'pdfFile') return;
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try {
      const giorni = await leggiSchemaPdf(file);
      if (giorni.length !== 7 || giorni.some((g) => !g.pasti.length)) {
        return alert('Non riesco a leggere lo schema da questo PDF. Controlla che sia lo schema dietetico.');
      }
      // La data di inizio si sceglie nel riquadro in cima a DATI
      pianoInAttesa = { nome: file.name.replace(/\.pdf$/i, ''), giorni };
      render(true);
    } catch (err) {
      alert('Non riesco a leggere questo PDF.');
    }
  });

  // Importa un backup: sostituisce i dati attuali con quelli del file
  document.addEventListener('change', async (e) => {
    if (e.target.id !== 'importFile') return;
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try {
      const parsed = JSON.parse(await file.text());
      if (!parsed || typeof parsed.profili !== 'object') throw new Error('formato');
      if (!confirm('Il backup sostituisce tutti i dati attuali. Continuo?')) return;
      state = { ...structuredClone(DEFAULT), ...parsed };
      save();
      render();
      alert('Backup importato.');
    } catch (err) {
      alert('File non valido: scegli un backup esportato da questa app.');
    }
  });

  ripristinaNativo().catch(() => {}).finally(() => render());
</script>
